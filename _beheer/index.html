<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Beheer website en webshop | Cycle Service</title>
  <meta name="description" content="Beheeromgeving van Cycle Service Sint-Oedenrode. Alleen voor de eigenaar.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/beheer/beheer.css">
  <script src="/beheer/beheer.js" defer></script>
</head>
<body>

<div class="laden" data-laden><span class="spinner" aria-hidden="true"></span></div>

<!-- inloggen -->
<main class="inlog" data-scherm="inlog" hidden>
  <form class="inlog-kaart" data-inlog>
    <img src="/assets/logo.svg" width="220" height="53" alt="Cycle Service">
    <h1>Beheer</h1>
    <p>Log in om je website en webshop aan te passen.</p>
    <label class="veld"><span>Wachtwoord</span><input type="password" name="wachtwoord" autocomplete="current-password" required autofocus></label>
    <label class="veld" data-code-veld hidden><span>Code uit je authenticator-app</span><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*"></label>
    <p class="fout" data-inlog-fout role="alert" hidden></p>
    <button class="knop vol" type="submit">Inloggen</button>
    <small>Beheer powered by Mettafel</small>
  </form>
</main>

<!-- de app -->
<div class="app" data-scherm="app" hidden>
  <aside class="zijbalk">
    <div class="merk"><img src="/assets/logo-wit.svg" width="180" height="43" alt="Cycle Service"><span>Beheer</span></div>
    <nav class="menu" data-menu aria-label="Beheer">
      <a href="#overzicht" data-naar="overzicht"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-winkel"/></svg>Overzicht</a>
      <a href="#producten" data-naar="producten"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-fiets"/></svg>Producten</a>
      <a href="#teksten" data-naar="teksten"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-uitleg"/></svg>Teksten en foto's</a>
      <a href="#prijzen" data-naar="prijzen"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-euro"/></svg>Prijzen en verzenden</a>
      <a href="#seo" data-naar="seo"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-filter"/></svg>Vindbaar in Google</a>
      <a href="#bestellingen" data-naar="bestellingen"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-tas"/></svg>Bestellingen<b class="teller" data-teller="bestellingen" hidden></b></a>
      <a href="#berichten" data-naar="berichten"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-mail"/></svg>Berichten<b class="teller" data-teller="berichten" hidden></b></a>
      <a href="#instellingen" data-naar="instellingen"><svg aria-hidden="true"><use href="/assets/iconen.svg#i-tandwiel"/></svg>Instellingen</a>
    </nav>
    <div class="zijvoet">
      <a class="knop licht" href="/" target="_blank" rel="noopener">Bekijk<span> de website</span></a>
      <button class="link" type="button" data-uitloggen>Uitloggen</button>
    </div>
  </aside>
  <main class="inhoud" data-inhoud tabindex="-1"></main>
</div>

<div class="toast" data-toast role="status" aria-live="polite" hidden></div>

</body>
</html>
